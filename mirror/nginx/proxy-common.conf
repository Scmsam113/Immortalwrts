# Included inside the three allowed locations.
rewrite ^/immortalwrt(/.*)$ $1 break;
proxy_pass https://$mirror_origin_host$mirror_origin_prefix$uri;
proxy_set_header Host $mirror_origin_host;
proxy_ssl_server_name on;
proxy_ssl_name $mirror_origin_host;
proxy_ssl_verify on;
proxy_ssl_verify_depth 4;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Authorization "";
proxy_set_header Cookie "";
proxy_set_header Accept-Encoding "";
# Cache bypass alone still uses Nginx's cache request-header rules, which
# suppress Range/If-Range unless they are explicitly forwarded here.
proxy_set_header Range $http_range;
proxy_set_header If-Range $http_if_range;
proxy_pass_request_body off;
proxy_set_header Content-Length "";
gzip off;

proxy_connect_timeout 10s;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
proxy_buffering on;
proxy_cache_key "https://$mirror_origin_host$mirror_origin_prefix$uri";
proxy_cache_lock on;
proxy_cache_lock_age 120s;
proxy_cache_lock_timeout 120s;
proxy_cache_bypass $mirror_has_range;
proxy_no_cache $mirror_has_range $upstream_http_set_cookie;
proxy_cache_use_stale off;
proxy_cache_background_update off;

proxy_intercept_errors on;
proxy_redirect off;
proxy_hide_header Set-Cookie;
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
add_header Cache-Control "no-store" always;
add_header X-Mirror-Cache $upstream_cache_status always;
