# Include from nginx.conf's http {} context (e.g. /etc/nginx/conf.d/).
# Copy proxy-common.conf to /etc/nginx/snippets/immortalwrt-proxy.conf.
proxy_cache_path /var/cache/nginx/immortalwrt levels=1:2
    keys_zone=immortalwrt:16m max_size=10g inactive=7d use_temp_path=off;

map $http_range $mirror_has_range {
    ""      0;
    default 1;
}

limit_req_zone $binary_remote_addr zone=mirror_requests:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=mirror_connections:10m;

log_format mirror '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
    'cache=$upstream_cache_status upstream=$upstream_status '
    'total=$request_time origin=$upstream_response_time';

server {
    listen 80;
    server_name mirror.example.com;
    if ($host != mirror.example.com) { return 444; }
    return 301 https://mirror.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name mirror.example.com;
    ssl_certificate /etc/letsencrypt/live/mirror.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mirror.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/immortalwrt-access.log mirror;
    error_log /var/log/nginx/immortalwrt-error.log warn;

    # Fixed by the administrator, never taken from a client header/argument.
    # For NJU: host=mirrors.nju.edu.cn, prefix=/immortalwrt.
    set $mirror_origin_host downloads.immortalwrt.org;
    set $mirror_origin_prefix "";
    resolver 1.1.1.1 1.0.0.1 valid=300s ipv6=off;
    resolver_timeout 5s;

    limit_req zone=mirror_requests burst=40 nodelay;
    limit_req_status 429;
    limit_conn mirror_connections 16;
    limit_conn_status 429;
    if ($host != mirror.example.com) { return 444; }
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    if ($args != "") { return 400; }
    if ($request_uri ~ "%|//|/\.{1,2}(/|$)") { return 400; }

    # Do not send clients to the origin on redirects, or silently switch mirrors.
    error_page 301 302 303 307 308 =502 @origin_redirect;
    location @origin_redirect { return 502; }

    # A release repository can still publish updated packages: finite TTL only.
    location ~ ^/immortalwrt/releases/[A-Za-z0-9._+~/-]+\.(ipk|apk)$ {
        include /etc/nginx/snippets/immortalwrt-proxy.conf;
        proxy_cache immortalwrt;
        proxy_cache_valid 200 24h;
        # Override freshness only for these public package artifacts.
        proxy_ignore_headers Cache-Control Expires X-Accel-Expires;
    }

    location ~ ^/immortalwrt/snapshots/[A-Za-z0-9._+~/-]+\.(ipk|apk)$ {
        include /etc/nginx/snippets/immortalwrt-proxy.conf;
        proxy_cache immortalwrt;
        proxy_cache_valid 200 1h;
        proxy_ignore_headers Cache-Control Expires X-Accel-Expires;
    }

    # Never cache indexes or detached signatures independently.
    location ~ ^/immortalwrt/(releases|snapshots)/[A-Za-z0-9._+~/-]+/(Packages(\.(gz|sig|manifest))?|packages\.adb(\.(sig|asc))?|APKINDEX\.tar\.gz)$ {
        include /etc/nginx/snippets/immortalwrt-proxy.conf;
        proxy_cache off;
    }

    # No directory listings, firmware images, arbitrary URLs or unrelated paths.
    location / { return 404; }
}
