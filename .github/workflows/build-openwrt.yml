name: Build ImmortalWrt

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      device:
        required: true
        type: string
      op_name:
        required: true
        type: string
      target_config:
        required: true
        type: string
      app_config:
        required: true
        type: string
      cache_scope:
        required: true
        type: string
      cache_mode:
        required: false
        type: string
        default: readwrite
      upload_release:
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: immortalwrt-${{ inputs.branch }}-${{ inputs.device }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ inputs.device }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: write
    env:
      TZ: Asia/Shanghai
      UPSTREAM_BRANCH: ${{ inputs.branch }}
      OPENWRT_DIR: /mnt/workdir/openwrt
      CCACHE_DIR: /mnt/workdir/cache/ccache
      CCACHE_BASEDIR: /mnt/workdir/openwrt
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1.5GiB
      BUILD_LOG_DIR: /mnt/workdir/build-logs
      CACHE_MODE: ${{ inputs.cache_mode }}
      CACHE_SCOPE: ${{ inputs.cache_scope }}
      CACHE_PLATFORM: ubuntu2204
      # Keep this in the cache key when changing what is safe to restore.
      CACHE_SCHEMA: v3

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/*
          sudo -E apt-get -qq update
          bash "$GITHUB_WORKSPACE/scripts/prepare-env.sh"
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /mnt/workdir
          sudo chown "$USER:$(id -gn)" /mnt/workdir

      - name: Clone ImmortalWrt
        working-directory: /mnt/workdir
        run: |
          df -hT "$PWD"
          bash "$GITHUB_WORKSPACE/scripts/clone-source.sh" openwrt
          ln -sf /mnt/workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

      - name: Apply system settings and feeds
        run: bash "$GITHUB_WORKSPACE/scripts/apply-openwrt.sh" system feeds

      - name: Update feeds
        run: cd "$OPENWRT_DIR" && ./scripts/feeds update -a

      - name: Install feeds
        run: cd "$OPENWRT_DIR" && ./scripts/feeds install -a

      - name: Apply third-party packages
        run: bash "$GITHUB_WORKSPACE/scripts/apply-openwrt.sh" packages

      - name: Compose configuration
        env:
          TARGET_CONFIG: ${{ inputs.target_config }}
          APP_CONFIG: ${{ inputs.app_config }}
        run: bash "$GITHUB_WORKSPACE/scripts/compose-config.sh"

      - name: Record build and cache metadata
        id: cache_meta
        run: bash "$GITHUB_WORKSPACE/scripts/cache.sh" metadata

      # Downloads (including mutable Go module trees) are deliberately rebuilt.
      # Each successful run publishes a new ccache snapshot instead of freezing
      # an immutable cache at the first successful build of a configuration.
      - name: Restore ccache
        id: restore_ccache
        if: ${{ inputs.cache_mode == 'readwrite' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: /mnt/workdir/cache/ccache
          key: ${{ steps.cache_meta.outputs.prefix }}${{ steps.cache_meta.outputs.config_hash }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.cache_meta.outputs.prefix }}${{ steps.cache_meta.outputs.config_hash }}-
            ${{ steps.cache_meta.outputs.prefix }}

      - name: Initialize ccache
        id: init_ccache
        env:
          CACHE_RESTORE_OUTCOME: ${{ steps.restore_ccache.outcome }}
          CACHE_EXACT_HIT: ${{ steps.restore_ccache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.restore_ccache.outputs.cache-matched-key }}
        run: bash "$GITHUB_WORKSPACE/scripts/cache.sh" init

      - name: Download package sources
        run: bash "$GITHUB_WORKSPACE/scripts/build.sh" download

      - name: Build tools
        run: bash "$GITHUB_WORKSPACE/scripts/build.sh" tools

      - name: Build toolchain
        run: bash "$GITHUB_WORKSPACE/scripts/build.sh" toolchain

      - name: Build target kernel
        run: bash "$GITHUB_WORKSPACE/scripts/build.sh" target

      - name: Build packages
        run: bash "$GITHUB_WORKSPACE/scripts/build.sh" packages

      - name: Build firmware images
        id: images
        run: bash "$GITHUB_WORKSPACE/scripts/build.sh" images

      - name: Prepare ccache snapshot
        id: prepare_ccache
        if: ${{ !cancelled() && steps.images.outcome == 'success' && inputs.cache_mode != 'off' }}
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/cache.sh" prepare

      - name: Save ccache
        id: save_ccache
        if: ${{ !cancelled() && steps.prepare_ccache.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: /mnt/workdir/cache/ccache
          key: ${{ steps.cache_meta.outputs.prefix }}${{ steps.cache_meta.outputs.config_hash }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Retain latest ccache snapshot
        if: ${{ !cancelled() && steps.save_ccache.outcome == 'success' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CACHE_PREFIX: ${{ steps.cache_meta.outputs.prefix }}
          CACHE_CURRENT_KEY: ${{ steps.cache_meta.outputs.prefix }}${{ steps.cache_meta.outputs.config_hash }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash "$GITHUB_WORKSPACE/scripts/cache.sh" prune

      - name: Upload build diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ inputs.device }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /mnt/workdir/build-logs
          retention-days: 14
          if-no-files-found: warn

      - name: Check space usage
        if: always()
        run: df -hT

      - name: Organize files
        id: organize
        run: |
          firmware_dir="$(find "$OPENWRT_DIR/bin/targets" -mindepth 2 -maxdepth 2 -type d | head -n 1)"
          [ -n "$firmware_dir" ] || { echo "Firmware directory not found." >&2; exit 1; }
          rm -rf "$firmware_dir/packages"
          echo "FIRMWARE=$firmware_dir" >> "$GITHUB_ENV"
          echo "file_date=$(date +"%Y%m%d%H%M")" >> "$GITHUB_OUTPUT"

      - name: Upload firmware directory
        uses: actions/upload-artifact@v7
        with:
          name: ImmortalWrt_${{ inputs.device }}_${{ steps.organize.outputs.file_date }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release metadata
        if: ${{ inputs.upload_release }}
        run: |
          release_tag="immortalwrt-${{ inputs.device }}-${{ github.run_id }}-${{ github.run_attempt }}"
          git check-ref-format "refs/tags/$release_tag"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=ImmortalWrt ${{ inputs.op_name }}" >> "$GITHUB_ENV"
          {
            echo "![Release Downloads](https://img.shields.io/github/downloads/${{ github.repository }}/$release_tag/total?style=flat-square)"
            echo
            echo "Source: ImmortalWrt"
            echo "Branch: ${{ inputs.branch }}"
            echo "Device: ${{ inputs.op_name }}"
          } > release.txt

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v3.0.3
        if: ${{ inputs.upload_release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*
